# invest-nyawit — server stack 24/7 (n8n + Postgres + render + dashboard + Caddy)
# Deploy (dari root folder): isi .env lalu
#   docker compose --env-file .env -f server/docker-compose.yml up -d --build
# Semua image multi-arch — jalan di ARM (Oracle Ampere) maupun x86.

name: invest-nyawit

# Log rotation bersama — cegah log (terutama n8n) memenuhi disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/healthz',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Host + base URL publik = tunnel (PUBLIC_BASE_URL/PUBLIC_HOST di .env,
      # diupdate scripts/tunnel-up.ps1 saat URL tunnel berubah).
      - N8N_HOST=${PUBLIC_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${PUBLIC_BASE_URL}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_SECURE_COOKIE=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # LLM (OpenAI-compatible: OpenRouter/Groq/Gemini-proxy/Ollama)
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      # Shopee Affiliate Open API
      - SHOPEE_AFFILIATE_APPID=${SHOPEE_AFFILIATE_APPID}
      - SHOPEE_AFFILIATE_SECRET=${SHOPEE_AFFILIATE_SECRET}
      # TikTok OAuth (developer app — lihat docs/SETUP.md)
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      # Instagram Graph API
      - IG_APP_ID=${IG_APP_ID}
      - IG_APP_SECRET=${IG_APP_SECRET}
      # Telegram bot approval
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Pipeline
      - RENDER_SERVICE_URL=http://render:8090
      - PUBLIC_MEDIA_URL=${PUBLIC_BASE_URL}/media/
      - AI_GATE_MIN=${AI_GATE_MIN}
      - POSTS_PER_DAY_ID=${POSTS_PER_DAY_ID}
      - POSTS_PER_DAY_EN=${POSTS_PER_DAY_EN}
      - HANDLE_ID=${HANDLE_ID}
      - HANDLE_EN=${HANDLE_EN}
      # Izin Code node: akses $env + require('crypto') untuk signing Shopee
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    depends_on:
      - postgres
      - render
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./../data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  render:
    build: ../services/render
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8090),2).close()\""]
      interval: 60s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - CAPTION_FONT=DejaVu Sans
    volumes:
      - media_data:/media
    # render.py default: python render.py --serve --port 8090 --media /media
    command: ["python", "render.py", "--serve", "--port", "8090", "--media", "/media"]

  dashboard:
    build: ../services/dashboard
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')\""]
      interval: 60s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      # psycopg baca env libpq standar
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PUBLIC_MEDIA_URL=${PUBLIC_BASE_URL}/media/
      - SITE_HANDLE=${HANDLE_ID}
      # basic auth (dipakai app.py langsung — Caddy juga punya utk domain)
      - STATS_USER=${STATS_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
      # internal token utk trend_scout → dashboard POST
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      - postgres

  trend_scout:
    build: ../services/trend_scout
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      - DASHBOARD_URL=http://dashboard:8091
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - STATS_USER=${STATS_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - render
      - dashboard

volumes:
  n8n_data:
  pg_data:
  media_data:
  caddy_data:
  caddy_config:
